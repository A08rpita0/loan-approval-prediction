[project]
name = "loan-approval"
version = "1.0.0"
description = "Loan approval prediction with a reproducible scikit-learn pipeline and Streamlit UI"
requires-python = ">=3.11"
authors = [{ name = "Arpita Khobragade" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806"]  # allow sklearn-style X / X_train names

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.per-file-ignores]
"loan_approval/train.py" = ["E501"]  # long lines in the model-card markdown template
